version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: netlens
      POSTGRES_PASSWORD: netlens
      POSTGRES_DB: netlens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://netlens:netlens@db:5432/netlens
      JWT_SECRET: change-me-to-a-long-random-string
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
volumes:
  pgdata:
